services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      # The root .dockerignore excludes .devcontainer for the app images, so
      # files baked into this image come from a separate named context.
      additional_contexts:
        devcontainer: .
    # Reap orphaned helpers from terminal sessions and coding agents.
    init: true
    env_file:
      - path: .env.local
        required: false
    environment:
      # DATABASE_URL is the object owner (== helix_migrate in dev): migrations run
      # as it, and it's the vitest/CLI DSN. The runtime services each connect as
      # their own least-privilege role instead (app-data design §2.1, ADR-0002) —
      # created by db-init/01-roles.sql. The portal runs as helix_portal (full
      # DML, but not the owner, so it can't DROP TABLE or bypass RLS as owner);
      # the edge as helix_edge (tight per-table grants only).
      DATABASE_URL: postgresql://helix:helix@db:5432/helix
      PORTAL_DATABASE_URL: postgresql://helix_portal:helix_portal@db:5432/helix
      EDGE_DATABASE_URL: postgresql://helix_edge:helix_edge@db:5432/helix
      # Dev-gateway (dev-mode §3): its own least-privilege helix_dev role +
      # per-plane opt-in. A separate process (`pnpm dev:devgw`, :8082).
      EDGE_DEV_DATABASE_URL: postgresql://helix_dev:helix_dev@db:5432/helix
      EDGE_ALLOW_DEV_MODE: "true"
      # Dedicated test database (created + migrated by vitest global setup).
      TEST_DATABASE_URL: postgresql://helix:helix@db:5432/helix_test
      # Azurite well-known emulator credentials. Endpoints point at the
      # `azurite` service over the compose network.
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1"
      # Blob container for app bundles.
      BLOB_CONTAINER: app-bundles
      # M1 deploy auth stub: bearer token required on mutating portal routes.
      # M3 demotes it to one verifier in a chain (OIDC is the real path);
      # kept for CI/scripts, refused in production.
      PORTAL_DEV_TOKEN: dev-deploy-token
      # Encrypts the shared-password credential at rest (apps/portal/src/access/
      # password.ts). Dev-only well-known value, ≥32 bytes; set a real secret in
      # prod. Only the portal needs it — the edge holds the hash, not this key.
      PORTAL_SECRET: aGVsaXgtZGV2LXBvcnRhbC1zZWNyZXQtMzItYnl0ZXMh
      # M3 local IdP (`pnpm dev:idp`, apps/dev-idp). It runs in THIS container,
      # not as a compose service: an OIDC issuer is a single string enforced
      # by every client, and only localhost + port forwarding reads the same
      # from the host browser and in-container back-channels.
      PORTAL_OIDC_ISSUER: http://localhost:3002
      PORTAL_OIDC_AUDIENCE: urn:helix:portal
      # The portal requires an https issuer/JWKS unless this dev flag is set
      # (refused under NODE_ENV=production) — the local IdP is plain http.
      PORTAL_OIDC_ALLOW_INSECURE: "true"
      AZX_CLI_CLIENT_ID: azx-cli
      # Approvals admin gate (docs/design/approvals.md §4): membership in this
      # group id permits deciding requests. dev-idp ships alice in this group
      # (apps/dev-idp fixtures `GROUP_PLATFORM_ADMINS`).
      PORTAL_ADMIN_GROUP_ID: platform-admin
      # Dev-only: let an admin decide their own request so a solo operator can
      # drive the whole request→approve loop. Refused under NODE_ENV=production.
      PORTAL_ALLOW_SELF_APPROVE: "true"
      # Give the dev-token actor the admin group too (CI/scripts driving the
      # approval loop without the OIDC device flow).
      PORTAL_DEV_ACTOR_GROUPS: platform-admin
      # M2 edge auth bypass — dev container only, refused under
      # NODE_ENV=production. "true" skips the session gate on app hosts (M2
      # default, pre-auth). Now that the M3 auth block below is wired, we leave
      # it OFF so dev mirrors reality: app navigations 302 into the real SSO
      # flow, sessions are minted, and the session-gated `/_api/*` gateway is
      # exercisable through the browser. Flip to "true" only to serve app
      # content without login (e.g. debugging asset serving in isolation).
      EDGE_DEV_ALLOW_UNAUTHENTICATED: "false"
      # Open-surface visibility policy. Both flags default OFF (opt-in) as the
      # platform default — a deployment must opt each surface in. Enabled here so
      # local dev can still create/serve `public` (anonymous) and `password`
      # (shared-passphrase) apps; the edge and portal each enforce their own half,
      # so both planes need the pair. Leave a surface off to exercise the 403 path.
      EDGE_ALLOW_PUBLIC_APPS: "true"
      EDGE_ALLOW_PASSWORD_APPS: "true"
      PORTAL_ALLOW_PUBLIC_APPS: "true"
      PORTAL_ALLOW_PASSWORD_APPS: "true"
      # Offline IP geolocation for the Visitors view (ADR-0050). post-create.sh
      # downloads DB-IP City Lite here (gitignored); if that download failed, the
      # portal still boots and reports location as unavailable. Re-fetch with
      # `pnpm --filter @azx-pbc/portal geo:fetch`.
      PORTAL_GEOIP_DB_PATH: /workspace/apps/portal/geo/dbip-city-lite.mmdb
      # Apps serve on `<slug>.<EDGE_BASE_DOMAIN>`, auth on `auth.<EDGE_BASE_DOMAIN>`.
      # `*.local.helix.azxlabs.io` is a platform-owned wildcard that resolves to
      # 127.0.0.1 (see the DNS note in the repo docs) — a controlled replacement
      # for the third-party `localtest.me`. The mkcert wildcard cert below matches.
      # Optional HELIX_APPS_DOMAIN (read by Compose when the dev container is
      # created — export it in the shell that starts the container, or put it in
      # `.devcontainer/.env`; `.env.local` is only an env_file and does not feed
      # substitution) moves hosted apps to a second loopback domain while the
      # control plane stays on `local.helix.azxlabs.io`. Unset means single-domain
      # dev unchanged.
      HELIX_APPS_DOMAIN: ${HELIX_APPS_DOMAIN:-}
      EDGE_BASE_DOMAIN: ${HELIX_APPS_DOMAIN:-local.helix.azxlabs.io}
      EDGE_CONTROL_DOMAIN: ${HELIX_APPS_DOMAIN:+local.helix.azxlabs.io}
      # The portal half of the same topology, served to the prebuilt SPA at
      # runtime by GET /api/v1/config (and used for the `url` on every app the
      # API returns). Set here so local dev exercises the real path rather than
      # the built-in fallback. The dev gateway is a separate process on :8082
      # (`pnpm dev:devgw`) — blank this out to see the "dev mode isn't enabled"
      # state the SPA shows when a deployment skips it.
      APP_PUBLIC_BASE: https://${HELIX_APPS_DOMAIN:-local.helix.azxlabs.io}:8080
      CONTROL_PUBLIC_BASE: ${HELIX_APPS_DOMAIN:+https://local.helix.azxlabs.io:8080}
      DEV_API_PUBLIC_BASE: https://dev-api.local.helix.azxlabs.io:8082
      # M3 edge app-user auth, against the local dev IdP (`pnpm dev:idp`).
      # Dev-only well-known values, mirrored in apps/dev-idp fixtures.
      EDGE_OIDC_ISSUER: http://localhost:3002
      EDGE_OIDC_CLIENT_ID: helix-edge
      EDGE_OIDC_CLIENT_SECRET: edge-dev-secret
      EDGE_OIDC_ALLOW_INSECURE: "true"
      EDGE_AUTH_SECRET: aGVsaXgtZGV2LWVkZ2UtYXV0aC1zZWNyZXQtMzItYiE=
      # mkcert wildcard cert (generated by post-create.sh, gitignored). The
      # platform is HTTPS-only: the edge REFUSES to boot in dev without these
      # (loadConfig). __Host- cookies need Secure and app crypto APIs
      # (crypto.randomUUID, SubtleCrypto) need a secure context. In-container
      # Node trusts the CA via NODE_EXTRA_CA_CERTS; the host browser sees a
      # self-signed cert — accept it once (or trust certs/caroot/rootCA.pem).
      EDGE_TLS_CERT_FILE: /workspace/.devcontainer/certs/local-helix${HELIX_APPS_DOMAIN:+-split}.pem
      EDGE_TLS_KEY_FILE: /workspace/.devcontainer/certs/local-helix${HELIX_APPS_DOMAIN:+-split}-key.pem
      NODE_EXTRA_CA_CERTS: /workspace/.devcontainer/certs/caroot/rootCA.pem
      # M4.5 helix-egress mechanism plane (`pnpm dev:egress`, :8081). It connects
      # as the least-privilege helix_egress role (created by db-init/01-roles.sql)
      # — the only role that may read app_secrets.material.
      EGRESS_DATABASE_URL: postgresql://helix_egress:helix_egress@db:5432/helix
      # Shared HS256 secret for the attested instruction the edge mints and egress
      # verifies (HKDF-derived both sides). Dev-only well-known value, ≥32 bytes.
      HELIX_INSTRUCTION_SECRET: aGVsaXgtZGV2LWluc3RydWN0aW9uLXNlY3JldC0zMmItbWluIQ==
      # The two new internal-JWT keys (same discipline as above):
      # edge↔portal (edge mints, portal verifies) and portal↔egress (portal
      # mints, egress verifies). Dev-only well-known values, ≥32 bytes.
      HELIX_INTERNAL_SECRET: aGVsaXgtZGV2LWludGVybmFsLXNlY3JldC0zMmItbWluIQ==
      HELIX_EXCHANGE_SECRET: aGVsaXgtZGV2LWV4Y2hhbmdlLXNlY3JldC0zMmItbWluIQ==
      # The edge forwards authorized /_api/fetch calls to egress over this URL
      # (same container in dev; a private internal address in prod).
      EDGE_EGRESS_URL: http://localhost:8081
      # The portal delegates the OAuth code exchange to egress over this URL
      # (same container in dev; the private internal
      # address in prod). Unset leaves the delegation unwired.
      PORTAL_EGRESS_URL: http://localhost:8081
      # Edge → portal internal base: the consent-start
      # consult and the auth-host /connections/* reverse proxy. Fail-closed
      # (503) when unset — without it the OAuth-consent surfaces cannot run.
      EDGE_PORTAL_URL: http://localhost:3001
      # Dev-tier escape hatches for exercising OAuth connections against the
      # loopback fixture vendor (pnpm dev:vendor, :3003): egress's SSRF controls
      # normally refuse private/loopback targets, and delegated calls require
      # https. Both are refused under NODE_ENV=production.
      EGRESS_ALLOW_PRIVATE: "true"
      EGRESS_ALLOW_INSECURE_CONNECTION: "true"
      # OpenTelemetry (ADR-0037). Points every service at the local collector
      # below, the same shape as Azurite standing in for Blob: the OTLP path is
      # exercised locally rather than first discovered in Azure, where its
      # failure mode is silence rather than an error.
      #
      # Comment this out to get the platform's DEFAULT state — telemetry
      # entirely inert, no provider constructed — which is what a deployment
      # that has not configured a collector runs, and worth returning to
      # occasionally so "works locally" doesn't come to depend on it.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Dev secret-store KEK (generated by post-create.sh into the gitignored
      # certs dir). The portal seals secrets under it; egress opens them. In prod
      # this is unset and Key Vault (AZURE_KEY_VAULT_URL) is the store instead.
      DEV_SECRETS_KEK_FILE: /workspace/.devcontainer/certs/secrets-kek.dev
    volumes:
      # `consistent`, deliberately: the container gets no SSH key (security
      # boundary), so this bind mount is the *only* way files leave the
      # container. We want the host view to always be authoritative-current —
      # no staleness window on our one egress path. Perf cost is marginal on
      # VirtioFS, and the hot churn (node_modules/pnpm-store) is on named
      # volumes below, so it doesn't pay the consistency tax anyway.
      - ..:/workspace:consistent
      # pnpm monorepo: keep node_modules off the macOS bind mount (perf) and
      # persist the pnpm store so reinstalls are near-instant across rebuilds.
      - helix-node-modules:/workspace/node_modules
      - pnpm-store:/home/node/.pnpm-store
      - playwright-cache:/home/node/.cache/ms-playwright
      # AI CLI config persisted across container rebuilds (log in once, stays).
      - claude-config:/home/node/.claude
      - codex-config:/home/node/.codex
      - opencode-config:/home/node/.config/opencode
      - opencode-data:/home/node/.local/share/opencode
      # ~/.pi/agent is pi's entire agent dir: settings.json, auth.json,
      # extensions, and sessions — one volume covers logins and history.
      - pi-config:/home/node/.pi/agent
      - ssh-authorized-keys:/home/node/.ssh
      - ssh-host-keys:/var/lib/helix-ssh
      - herdr-config:/home/node/.config/herdr
      - moshi-config:/home/node/.config/moshi
    ports:
      - "51271:22"
      - "60000-60010:60000-60010/udp"
    command: ["sudo", "-E", "/usr/local/bin/helix-start-remote"]
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
      POSTGRES_DB: helix
    volumes:
      - pgdata:/var/lib/postgresql
      # App-data design §2.1: create the helix_edge/helix_portal runtime roles on
      # first init (empty data dir only). Recreate the pgdata volume to re-run.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Randomized host port to avoid collisions with other local stacks.
      - "26663:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    # --skipApiVersionCheck: the storage SDK sends a newer x-ms-version than
    # older Azurite images accept; skip the check so the blob integration tests
    # run against this emulator.
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --skipApiVersionCheck
    volumes:
      - azurite-data:/data
    ports:
      # Randomized host ports (container ports stay at Azurite defaults).
      - "37604:10000"
      - "26585:10001"
      - "40209:10002"

  # Jaeger all-in-one: an OTLP/HTTP receiver plus a trace UI, in one image with
  # no config file. Chosen over the upstream otel-collector for local use
  # precisely because it needs no config — the point here is to exercise the
  # export path and to be able to LOOK at a trace crossing edge → egress, which
  # is the thing ADR-0037 says cannot be seen today.
  #
  # It is not a model of production: the Azure destination is decided in
  # `infra/azure` and the service-side code is byte-identical either way, which
  # is what makes that an infrastructure decision rather than an architectural
  # one (ADR-0037 decision 2). Metrics are accepted and dropped — Jaeger stores
  # traces only, so assert metrics in tests, not here.
  otel-collector:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # Jaeger UI. Randomized host port, matching the convention above.
      - "27686:16686"
    # Traces are throwaway; no volume. A restart is a clean slate, which is
    # usually what you want mid-debugging.

volumes:
  helix-node-modules:
  pnpm-store:
  playwright-cache:
  pgdata:
  azurite-data:
  claude-config:
  codex-config:
  opencode-config:
  opencode-data:
  pi-config:
  ssh-authorized-keys:
  ssh-host-keys:
  herdr-config:
  moshi-config:
