name: CI

# Basic CI: runs the same checks as ./check-and-lint.sh (typecheck, lint,
# format:check, docs build, tests), then builds the three app images and
# publishes them to the GitHub Container Registry (GHCR).
#
# The checks are split across two jobs by what they *need*, not by what they
# are. Only the test suite touches Postgres or Blob, so `static` (typecheck +
# lint + format + the docs build) skips the service containers, the Azurite
# pull, the role SQL and the KEK entirely, and runs concurrently with `test`.
# Both invoke ./check-and-lint.sh with step names rather than open-coding the
# pnpm commands, so the gate CI runs and the gate a developer runs locally
# stay the same script.
#
# Measured, as of the split (the `timing:` line at the end of each "Run checks"
# step is where these come from — keep it, it is how the layout stays honest):
#
#   static  36s of checks (typecheck 19 · lint 10 · format 7) in a 56s job
#   test    76s of checks in a 1m54s job (before sharding)
#
# (The docs build joined `static` later: a few seconds, no services needed, so
# the job floor is unchanged in kind. The `timing:` line is the current truth.)
#
# One job doing all of it was 2m34s. `test` is then sharded three ways, since
# 76s of vitest on a 2-core runner is mostly lost in-process parallelism — the
# same suite is ~10s wall in the dev container. Each shard re-pays ~39s of
# fixed setup (image pulls and install, not our code) to run ~25s of tests,
# which is why three and not six: the job floor is `static` at 56s.
#
# This costs runner-seconds to save wall clock, which is the right trade here
# only because the repo is public — standard GitHub-hosted runners are free and
# unbilled for public repos. Concurrency is the real budget (per *account*, not
# per repo), and three shards takes wave 1 from 3 jobs to 5, matching the peak
# the `images` matrix already sets. Revisit this if the repo goes private.
#
# The `test` job reproduces the dev-container environment (.devcontainer/
# docker-compose.yml): the same least-privilege Postgres role split, an Azurite
# blob emulator, and the same (dev-only, well-known) env values. `db` and
# `azurite` are aliased to localhost so the hostnames the tests hardcode resolve
# exactly as they do in the dev container.
#
# `bicep` is an independent lane — it shares no toolchain with the node stack,
# gates nothing and is gated by nothing.
#
# `browser-lane` is the real-browser acceptance lane: it needs
# only Postgres as a service (the fixture vendor, the dev IdP and the
# portal/edge/egress apps are booted in-process by the lane itself) and starts
# immediately, concurrent with `static` and `test`. No `needs`: nothing it
# reads is produced by another job, and `static` is what catches lane type
# errors (playwright transpiles, it does not typecheck) — gating the browser
# install behind `static` would trade wall clock on every green run for a
# fast-fail that only saves runner minutes, and runner minutes are free on a
# public repo. It is still a GATE: `package` and `images` wait on it, so a
# real-browser failure blocks the publish path. It uploads its
# traces/screenshots on failure.

# The automatic triggers are commented out: the repo is private, so every run
# bills Actions minutes. Run it by hand from the Actions tab, or uncomment the
# triggers to restore it.
on:
  # push:
  #   branches: [main]
  #   tags: ["v*"]
  # pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch) —
# but only for PRs. On `main` and on tags, a run's tail is a *publish*: two
# merges in quick succession would otherwise cancel the first run mid-push and
# that commit's GHCR tags would never land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: typecheck · lint · format · docs
    runs-on: ubuntu-latest
    # Static analysis + the docs build: no database, no blob store, no secrets.
    # If a check added here starts needing a service container, it belongs in
    # `test`.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run checks (typecheck · lint · format · docs)
        # Step names, so this is the same script a developer runs locally; the
        # script still runs every named step even if an earlier one fails, then
        # exits non-zero — one run surfaces the full picture.
        run: ./check-and-lint.sh typecheck lint refs format docs

  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # A hung Azurite wait or a stuck integration suite would otherwise burn the
    # 6h runner default. The full pass is single-digit minutes; 20 is slack.
    timeout-minutes: 20

    strategy:
      # One shard failing must not cancel its siblings: the point of the script
      # running every step and reporting at the end is a full picture from one
      # run, and that holds across shards too.
      fail-fast: false
      matrix:
        # Three ways splits ~76s of vitest into ~25s against ~39s of fixed
        # per-shard setup, which lands the job near the `static` job's floor.
        # A fourth shard buys a few seconds and pays another full setup.
        # Shards get a runner each, so each has its own Postgres service and
        # its own freshly-migrated helix_test — more isolation than one run,
        # not less. A fresh `prisma migrate deploy` is ~1s, so re-paying it per
        # shard is noise.
        shard: ["1/3", "2/3", "3/3"]

    services:
      # Matches .devcontainer/docker-compose.yml's `db`. Least-privilege runtime
      # roles are created below from the same db-init SQL the container uses.
      db:
        image: postgres:18
        env:
          POSTGRES_USER: helix
          POSTGRES_PASSWORD: helix
          POSTGRES_DB: helix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helix -d helix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # ── Mirror of .devcontainer/docker-compose.yml's env (dev-only, well-known
      # values — NOT secrets). Hostnames `db`/`azurite` are aliased to localhost
      # in the "Resolve db/azurite hostnames" step below.
      DATABASE_URL: postgresql://helix:helix@db:5432/helix
      PORTAL_DATABASE_URL: postgresql://helix_portal:helix_portal@db:5432/helix
      EDGE_DATABASE_URL: postgresql://helix_edge:helix_edge@db:5432/helix
      EDGE_DEV_DATABASE_URL: postgresql://helix_dev:helix_dev@db:5432/helix
      EGRESS_DATABASE_URL: postgresql://helix_egress:helix_egress@db:5432/helix
      TEST_DATABASE_URL: postgresql://helix:helix@db:5432/helix_test
      EDGE_ALLOW_DEV_MODE: "true"
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1"
      BLOB_CONTAINER: app-bundles
      PORTAL_DEV_TOKEN: dev-deploy-token
      PORTAL_SECRET: aGVsaXgtZGV2LXBvcnRhbC1zZWNyZXQtMzItYnl0ZXMh
      PORTAL_OIDC_ISSUER: http://localhost:3002
      PORTAL_OIDC_AUDIENCE: urn:helix:portal
      PORTAL_OIDC_ALLOW_INSECURE: "true"
      AZX_CLI_CLIENT_ID: azx-cli
      PORTAL_ADMIN_GROUP_ID: platform-admin
      # PORTAL_ALLOW_SELF_APPROVE is deliberately NOT set here. It is a dev-only
      # escape hatch for a solo operator (the devcontainer sets it), and running
      # CI with separation of duty waived hid an order-dependence in the
      # approvals suite. The suite pins the flag itself in vitest.config.ts.
      PORTAL_DEV_ACTOR_GROUPS: platform-admin
      EDGE_DEV_ALLOW_UNAUTHENTICATED: "false"
      EDGE_ALLOW_PUBLIC_APPS: "true"
      EDGE_ALLOW_PASSWORD_APPS: "true"
      PORTAL_ALLOW_PUBLIC_APPS: "true"
      PORTAL_ALLOW_PASSWORD_APPS: "true"
      EDGE_BASE_DOMAIN: local.helix.azxlabs.io
      EDGE_OIDC_ISSUER: http://localhost:3002
      EDGE_OIDC_CLIENT_ID: helix-edge
      EDGE_OIDC_CLIENT_SECRET: edge-dev-secret
      EDGE_OIDC_ALLOW_INSECURE: "true"
      EDGE_AUTH_SECRET: aGVsaXgtZGV2LWVkZ2UtYXV0aC1zZWNyZXQtMzItYiE=
      HELIX_INSTRUCTION_SECRET: aGVsaXgtZGV2LWluc3RydWN0aW9uLXNlY3JldC0zMmItbWluIQ==
      # The two new internal-JWT keys — the portal's boot check
      # requires the edge↔portal key, and egress's config requires the
      # portal↔egress one, mirroring the devcontainer values.
      HELIX_INTERNAL_SECRET: aGVsaXgtZGV2LWludGVybmFsLXNlY3JldC0zMmItbWluIQ==
      HELIX_EXCHANGE_SECRET: aGVsaXgtZGV2LWV4Y2hhbmdlLXNlY3JldC0zMmItbWluIQ==
      EDGE_EGRESS_URL: http://localhost:8081
      # Dev secret-store KEK — generated below (mirrors post-create.sh); the
      # portal/egress boot paths read it, returning a null store (503) if absent.
      DEV_SECRETS_KEK_FILE: ${{ github.workspace }}/.ci-secrets-kek.dev

    steps:
      - uses: actions/checkout@v4

      - name: Resolve db/azurite hostnames to localhost
        # The Postgres service and the Azurite container both publish to
        # localhost; the tests reference them by the dev-container hostnames.
        run: echo "127.0.0.1 db azurite" | sudo tee -a /etc/hosts

      - name: Pull the Azurite image (backgrounded)
        # `docker run -d` detaches the *container*, not the pull — it still
        # blocks on the image before returning an ID, which is ~13s of the ~14s
        # this used to cost. So pull explicitly, as a background shell job, and
        # let it overlap the setup-node + pnpm install steps below. `disown`
        # keeps it off this step's exit wait.
        run: |
          nohup docker pull mcr.microsoft.com/azure-storage/azurite \
            > "$RUNNER_TEMP/azurite-pull.log" 2>&1 &
          disown

      - name: Create least-privilege Postgres roles
        # Same db-init the dev container runs on first boot (helix_portal /
        # helix_edge / helix_egress / helix_dev). Roles are cluster-global, so
        # they apply to the helix_test database vitest creates + migrates too.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .devcontainer/db-init/01-roles.sql

      - name: Generate dev secret-store KEK
        run: openssl rand -hex 32 > "$DEV_SECRETS_KEK_FILE" && chmod 600 "$DEV_SECRETS_KEK_FILE"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start Azurite (blob/queue/table emulator)
        # Not a GHA service: we need the `--skipApiVersionCheck` flag (the SDK
        # sends a newer x-ms-version than Azurite accepts), and service
        # containers have no way to pass arguments after the image name —
        # `options` reaches `docker create`, but there is no `command:`.
        # Command mirrors .devcontainer/docker-compose.yml. By now the pull
        # started above has usually finished; if not, this blocks on the tail
        # of it, which is still strictly better than blocking on all of it.
        run: |
          cat "$RUNNER_TEMP/azurite-pull.log" || true
          docker run -d --name azurite \
            -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 \
                    --location /data --skipApiVersionCheck

      - name: Wait for Azurite
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://azurite:10000/devstoreaccount1; then
              echo "Azurite is up"; exit 0
            fi
            sleep 1
          done
          echo "Azurite did not become ready" >&2; docker logs azurite >&2; exit 1

      - name: Run checks (test)
        run: ./check-and-lint.sh test -- --shard=${{ matrix.shard }}

  browser-lane:
    name: browser lane (playwright · connections)
    runs-on: ubuntu-latest
    # The real-browser acceptance lane: a
    # Chromium drives the assembled OAuth-connections journey against the real
    # edge/portal/egress + the fixture vendor + the dev IdP — all booted
    # in-process by the lane itself, so unlike `test` this job needs only
    # Postgres (no Azurite: the lane's edge reads its app page from an
    # in-memory blob double, and the fixture vendor/IdP are in-repo services
    # the lane starts, not containers). It is a GATE, not a follow-up: it
    # starts with the other jobs (no `needs` — the browser install costs only
    # free runner minutes, and `static` catches lane type errors in parallel),
    # and `package`/`images` wait on it, so a lane failure blocks the publish
    # path. The lane runs
    # headed under Xvfb (its config explains why — the popup blocker never
    # fires under CDP headless defaults), which is the standard headed-CI
    # shape; xvfb-run + xauth ship on the runner image, and playwright's
    # --with-deps covers the rest.
    timeout-minutes: 15

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: helix
          POSTGRES_PASSWORD: helix
          POSTGRES_DB: helix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helix -d helix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The lane's world derives the well-known dev values for everything else
      # (the internal-JWT keys, the portal verifier env, the dev-token actor)
      # so a local run needs zero env setup; these are the only two that name
      # the runner's Postgres — the admin DSN for the role SQL, and the test
      # DSN the lane's scratch database is carved from.
      DATABASE_URL: postgresql://helix:helix@db:5432/helix
      TEST_DATABASE_URL: postgresql://helix:helix@db:5432/helix_test
      HELIX_EXCHANGE_SECRET: aGVsaXgtZGV2LWV4Y2hhbmdlLXNlY3JldC0zMmItbWluIQ==

    steps:
      - uses: actions/checkout@v4

      - name: Resolve db hostname to localhost
        run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: Create least-privilege Postgres roles
        # Same db-init the dev container runs (helix_edge / helix_egress /
        # helix_dev) — the lane fails loudly without the runtime roles, by
        # design: an unprovisioned green run is not evidence.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .devcontainer/db-init/01-roles.sql

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          # The lane pins @playwright/test exactly (catalog comment: the binary
          # cache is keyed to the version's chromium revision).
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        run: pnpm --filter @azx-pbc/connections-lane exec playwright install --with-deps chromium

      - name: Run the connections browser lane
        run: xvfb-run -a pnpm --filter @azx-pbc/connections-lane test

      - name: Upload lane artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: connections-lane-artifacts
          path: apps/connections-lane/test-results/
          if-no-files-found: ignore

  bicep:
    name: bicep compiles
    runs-on: ubuntu-latest
    # Independent of the node stack: no `needs`, and nothing needs it. `az` and
    # the Bicep CLI ship on the ubuntu-latest image, so this job pays for a
    # checkout and nothing else. It is a compile check, not a `what-if` — it
    # catches a template that cannot build, not one that builds and misdeploys.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Compile the templates
        # --stdout >/dev/null: compiling to a file would litter the tree with
        # generated ARM JSON. build-params compiles main.bicepparam too, which
        # is where a param renamed in main.bicep but not in the param file (or
        # vice versa) shows up. infra/entra pulls the microsoftGraphV1 extension
        # declared in its bicepconfig.json.
        run: |
          az bicep build --file infra/azure/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/azure/main.bicepparam --stdout > /dev/null
          az bicep build-params --file infra/azure/main.bootstrap.bicepparam --stdout > /dev/null
          az bicep build --file infra/entra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/entra/main.bicepparam --stdout > /dev/null

  package:
    name: pack helix CLI
    runs-on: ubuntu-latest
    needs: [static, test, browser-lane]
    timeout-minutes: 15
    # The CLI is the one package we publish (ADR-0032), and the only one that
    # emits JS. Nothing in the unit suite touches the packaged artifact, so
    # without this job a broken shebang, a missed esbuild external, or a
    # tsx-at-runtime regression ships silently. Build → pack → install → run.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the bundle
        run: pnpm --filter @azx-pbc/helix-cli build

      - name: Pack
        working-directory: packages/cli
        # `pnpm pack`, never `npm pack`: only pnpm rewrites the `catalog:`
        # specifiers (and `workspace:*`) to real semver ranges. An npm-packed
        # tarball ships `"archiver": "catalog:"`, which no npm client can
        # resolve — the install below is what catches that.
        run: |
          pnpm pack --out "$RUNNER_TEMP/helix-cli.tgz"
          echo "TARBALL=$RUNNER_TEMP/helix-cli.tgz" >> "$GITHUB_ENV"
          tar -tzf "$RUNNER_TEMP/helix-cli.tgz"

      - name: Assert tarball contents
        working-directory: packages/cli
        # dist/helix.js is the bin target; src/ must not ship (it would drag in
        # the raw-TS @azx-pbc/shared imports that the bundle exists to inline).
        run: |
          tar -tzf "$TARBALL" | grep -qx 'package/dist/helix.js'
          if tar -tzf "$TARBALL" | grep -q 'package/src/'; then
            echo "::error::tarball ships src/ — check the \"files\" allowlist"
            exit 1
          fi

      - name: Assert the packed manifest has no workspace-only specifiers
        # Same guard release-cli.yml runs before publishing, here so a PR
        # catches it: a manifest published with `"zod": "catalog:"` installs for
        # nobody, and that version number can never be reused.
        run: |
          tar -xzOf "$TARBALL" package/package.json > "$RUNNER_TEMP/manifest.json"
          cat "$RUNNER_TEMP/manifest.json"
          if grep -qE '"(catalog|workspace):' "$RUNNER_TEMP/manifest.json"; then
            echo "::error::packed manifest still has catalog:/workspace: specifiers"
            exit 1
          fi

      - name: Smoke-test the installed binary
        # The load-bearing step: a clean global prefix, and tsx removed from
        # PATH entirely, so this passes only if the published artifact really
        # runs on plain node. Node's own bin dir has to stay on PATH — the
        # bundle's `#!/usr/bin/env node` shebang needs an interpreter, and
        # setup-node's is in the toolcache, not /usr/bin — but that dir holds
        # only node/npm/npx/corepack, so keeping it smuggles nothing back in.
        # The `command -v tsx` guard below is what actually enforces that.
        run: |
          NODE_BIN="$(dirname "$(command -v node)")"
          npm config set prefix "$RUNNER_TEMP/npm-global"
          npm i -g "$TARBALL"
          rm -rf node_modules packages/cli/node_modules
          export PATH="$RUNNER_TEMP/npm-global/bin:$NODE_BIN:/usr/bin:/bin"
          command -v node || { echo "::error::node not on the stripped PATH"; exit 1; }
          command -v tsx && { echo "::error::tsx still on PATH — test is not proving anything"; exit 1; }
          helix --help | tee /tmp/help.txt
          grep -q 'helix deploy' /tmp/help.txt

      - uses: actions/upload-artifact@v4
        with:
          name: helix-cli-tarball
          path: ${{ env.TARBALL }}

  images:
    name: build ${{ matrix.app }} image
    runs-on: ubuntu-latest
    needs: [static, test, browser-lane]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR

    strategy:
      fail-fast: false
      matrix:
        # edge/portal/egress are the runtime apps; certbot is the wildcard-TLS
        # automation image (scheduled ACA Job, not an app) — same build path.
        app: [edge, portal, egress, certbot]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Only needed when we actually push (skipped on PRs from forks, which
        # cannot receive a write token anyway).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the owner for us (GHCR requires lowercase).
          images: ghcr.io/${{ github.repository_owner }}/helix-${{ matrix.app }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Portal geolocation database (ADR-0050, apps/portal/Dockerfile): PR builds
      # skip the ~127 MB download; pushed builds take this month's release, or
      # last month's, with the month as the cache key so it refreshes monthly.
      # Unused by the other Dockerfiles.
      - name: Geolocation build args
        id: geo
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=GEOIP_DB_MONTH=skip" >> "$GITHUB_OUTPUT"
          else
            echo "args=GEOIP_CACHE_KEY=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: ${{ matrix.app == 'portal' && steps.geo.outputs.args || '' }}
          platforms: linux/amd64 # Azure Container Apps is amd64
          # Build on every event to catch Dockerfile breaks; push only off PRs.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
